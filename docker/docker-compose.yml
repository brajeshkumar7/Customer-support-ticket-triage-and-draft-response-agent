# Local dev stack - Redis (if used) runs here too. All free/local, no paid tiers.
services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../data:/app/data
