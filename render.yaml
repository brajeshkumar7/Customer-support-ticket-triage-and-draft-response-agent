# Controlled demonstration only. Syncing this Blueprint provisions paid resources.
services:
  - type: worker
    name: support-agent-controlled-worker
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.agent.production_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEPLOYMENT_MODE
        value: "off"
      - key: DATABASE_URL
        fromDatabase:
          name: support-agent-jobs
          property: connectionString
      - key: ZOHO_DESK_ORG_ID
        sync: false
      - key: ZOHO_DESK_API_DOMAIN
        sync: false
      - key: ZOHO_ACCOUNTS_DOMAIN
        sync: false
      - key: ZOHO_DESK_FROM_EMAIL
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: APPROVED_KNOWLEDGE_SHA256
        sync: false
databases:
  - name: support-agent-jobs
    plan: 0.1c-256mb
    ipAllowList: []
